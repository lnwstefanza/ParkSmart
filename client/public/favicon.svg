<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- พื้นหลังไล่เฉดสีฟ้าแบบ Modern Vibrant Blue -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />   <!-- Sky Blue -->
      <stop offset="60%" stop-color="#0284C7" />  <!-- Ocean Blue -->
      <stop offset="100%" stop-color="#1E40AF" /> <!-- Deep Blue -->
    </linearGradient>

    <!-- เงาใต้ปุ่มสร้างมิติ Soft Depth -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0284C7" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- พื้นหลังสี่เหลี่ยมโค้งมน (Squircle / Rounded Container) -->
  <rect x="10" y="10" width="100" height="100" rx="28" 
        fill="url(#blueGradient)" 
        filter="url(#cardShadow)" />

  <!-- สัญลักษณ์ภายใน (สีขาวล้วน Pure White): ช่องจอดรถ + ตัว P + รถยนต์ -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- กรอบช่องจอดรถ (Parking Bay) -->
    <path d="M 28,68 L 28,34 C 28,30 31,27 35,27 L 85,27 C 89,27 92,30 92,34 L 92,68" 
          stroke-width="5" opacity="0.85" />

    <!-- ตัวอักษร P (Parking) -->
    <path d="M 44,58 L 44,38 L 56,38 C 61,38 64.5,41.5 64.5,46 C 64.5,50.5 61,54 56,54 L 44,54" 
          stroke-width="5.5" />

    <!-- รูปรถยนต์ด้านหน้า/มุมข้างแบบมินิมอล -->
    <path d="M 38,76 
             L 42,67 C 43,65 45,64 47,64 
             L 73,64 C 75,64 77,65 78,67 
             L 82,76 C 85,76 87,78 87,81 
             L 87,85 C 87,87 85,88 84,88 
             L 36,88 C 35,88 33,87 33,85 
             L 33,81 C 33,78 35,76 38,76 Z" 
          stroke-width="5" />
    
    <!-- ล้อรถยนต์ซ้าย-ขวา -->
    <circle cx="45" cy="88" r="3.5" fill="#FFFFFF" stroke="none" />
    <circle cx="75" cy="88" r="3.5" fill="#FFFFFF" stroke="none" />
  </g>
</svg>
